; PlatformIO Project Configuration File
;
; Seeed XIAO ESP32-C5 main board — moteus-x1 over native CAN-FD (TWAI-FD).
; The official platformio/espressif32 platform tops out at Arduino core
; 2.0.17 and has no ESP32-C5 support; the community pioarduino platform
; ships Arduino 3.3.x on ESP-IDF 5.5.x, which is where both the C5 target
; and the esp_driver_twai (CAN-FD) component live.
;
; See MIGRATION_PLAN.md in this folder for the pin map and wiring.

[platformio]
; Isolated package dir: the official espressif32 platform (display project)
; and pioarduino both install a package named toolchain-riscv32-esp with
; incompatible versions — sharing ~/.platformio/packages makes every
; alternating build reinstall the toolchain and eventually corrupts it.
packages_dir = ${platformio.core_dir}/packages-pioarduino

[env:seeed_xiao_esp32c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = seeed_xiao_esp32c5
framework = arduino
upload_speed = 921600
monitor_speed = 115200
lib_deps =
	bblanchon/ArduinoJson @ ^6.18.5
	links2004/WebSockets @ ^2.7.1
	sparkfun/SparkFun BMI270 Arduino Library @ ^1.0.3
